# AltoMe runtime configuration. Edit this file before deployment; do not rebuild the image.

# HTTP listen address inside the container.
LISTEN_HOST=0.0.0.0
# HTTP port exposed by AltoMe.
LISTEN_PORT=18082

# Username used by Alertmanager Basic Auth.
WEBHOOK_USER=alertmanager
# Password is read from the mounted secret file.
WEBHOOK_PASSWORD_FILE=/run/secrets/webhook_password

# AppManager base URL, including HTTPS port.
ME_URL=https://117.5.151.176:8444
# AppManager API key file mounted into the container.
ME_API_KEY_FILE=/run/secrets/me_api_key
# Set true when AppManager has a trusted certificate.
ME_VERIFY_TLS=false
# AppManager API request timeout in seconds.
ME_TIMEOUT=30
# AppManager group/resource used as the owner of dynamic monitors.
ME_RESOURCE_ID=10000369

# Integration mode; keep dynamic_rest_monitor for fingerprint-based monitors.
APPMANAGER_INTEGRATION_MODE=dynamic_rest_monitor
# URL that AppManager uses to poll AltoMe feeds.
ME_FEED_BASE_URL=http://117.5.151.176:18082
# Feed Bearer token file mounted into the container.
ME_FEED_TOKEN_FILE=/run/secrets/feed_token
# Hours to retain a resolved monitor before cleanup.
RESOLVED_MONITOR_RETENTION_HOURS=24

# Persistent SQLite database path.
DB_PATH=/data/alerts.sqlite3
# Initial retry delay in seconds.
RETRY_SECONDS=15
# Re-sync interval for an already delivered firing alert.
SYNC_INTERVAL=30
# Maximum webhook request body size in bytes.
MAX_BODY_BYTES=2097152
# Alert identity fallback mode when fingerprint is absent.
IDENTITY_MODE=instance
# Python log level.
LOG_LEVEL=INFO

# Legacy slot setting; ignored in dynamic_rest_monitor mode.
ME_SLOT_ATTRIBUTE_IDS=10000385:402
