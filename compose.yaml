services:
  me-alert-sync:
    image: altome:v2
    # Chỉ bỏ comment dòng build khi cần build image trong môi trường phát triển.
    # build: .
    restart: unless-stopped
    init: true
    env_file: altome.conf
    ports:
      - "0.0.0.0:18082:18082" # restrict with firewall; prefer HTTPS reverse proxy for untrusted networks
    volumes:
      - ./data:/data
      - ./secrets:/run/secrets:ro
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp
