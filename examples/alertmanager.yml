# Merge receiver and route into the EXISTING alertmanager.yml (do not overwrite whole file).
# HTTPS recommended via ingress/reverse proxy; basic_auth password_file supported by AM.
route:
  receiver: me-appmanager
  group_by: ['alertname', 'instance']
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
receivers:
  - name: me-appmanager
    webhook_configs:
      - url: 'https://me-alert-sync.example.local/alertmanager-webhook'
        send_resolved: true
        max_alerts: 0
        http_config:
          basic_auth:
            username: alertmanager
            password_file: /etc/alertmanager/secrets/webhook_password
